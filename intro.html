<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille MAÏ – Introduction</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #004d40 0%, #00695c 50%, #6c8b63 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Effet de particules en arrière-plan */
    .background-pattern {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(210, 169, 77, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(244, 208, 63, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(108, 139, 99, 0.1) 0%, transparent 50%);
      animation: shimmer 10s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .intro-container {
      text-align: center;
      z-index: 10;
      position: relative;
    }

    .logo-intro {
      opacity: 0;
      transform: scale(0.8);
      animation: fadeZoomIn 2s ease-in-out forwards;
      max-width: 300px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
    }

    .welcome-text {
      opacity: 0;
      color: #f4d03f;
      font-size: 32px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      margin-top: 30px;
      text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 2s ease-in-out 0.5s forwards;
    }

    .subtitle-text {
      opacity: 0;
      color: white;
      font-size: 18px;
      margin-top: 15px;
      font-weight: 300;
      letter-spacing: 1px;
      animation: fadeInUp 2s ease-in-out 1s forwards;
    }

    /* Message de démarrage audio */
    .audio-control {
      position: absolute;
      bottom: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      opacity: 0;
      animation: fadeInUp 2s ease-in-out 1.5s forwards, pulse 2s ease-in-out infinite;
      transition: all 0.3s ease;
      display: block;
    }

    .audio-control:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .audio-control.hide {
      opacity: 0 !important;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes fadeZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animation de rotation douce */
    .logo-intro {
      animation: fadeZoomIn 2s ease-in-out forwards, gentleFloat 4s ease-in-out 2s infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .logo-intro {
        max-width: 200px;
      }
      .welcome-text {
        font-size: 24px;
      }
      .subtitle-text {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="background-pattern"></div>

  <div class="intro-container">
    <!-- Logo -->
    <img src="images/logo-mai.png" alt="Logo Famille MAÏ" class="logo-intro">

    <!-- Texte de bienvenue -->
    <h1 class="welcome-text">Famille MAÏ</h1>
    <p class="subtitle-text">🌿 MA GWAHÈ • Village MINSE • Pays Bassa</p>
  </div>

  <!-- Message pour démarrer l'expérience -->
  <button id="startBtn" class="audio-control">🎵 CLIQUEZ ICI POUR DÉMARRER</button>

  <!-- Audio d'intro avec la kora -->
  <audio id="introAudio" loop preload="auto">
    <source src="images/intro-kora.mp3" type="audio/mpeg">
    Votre navigateur ne supporte pas l'élément audio.
  </audio>

  <script>
    const audio = document.getElementById('introAudio');
    const startBtn = document.getElementById('startBtn');
    let audioStarted = false;
    let redirectTimeout;

    // Fonction pour démarrer l'expérience
    function startExperience() {
      if (audioStarted) {
        console.log('Audio déjà démarré, ignoré');
        return;
      }

      console.log('🎵 Tentative de démarrage audio...');

      // Forcer le volume au maximum
      audio.volume = 1.0;
      audio.muted = false;

      // Lancer l'audio
      const playPromise = audio.play();

      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            console.log('✅ Audio démarré avec SUCCÈS !');
            console.log('   Volume:', audio.volume);
            console.log('   Muted:', audio.muted);
            console.log('   Paused:', audio.paused);
            console.log('   Duration:', audio.duration);

            // Marquer comme démarré seulement si succès
            audioStarted = true;

            // Masquer le message
            startBtn.classList.add('hide');

            // Démarrer le compte à rebours pour la redirection
            startRedirectTimer();
          })
          .catch((error) => {
            console.error('❌ ERREUR lecture audio:', error);
            console.error('   Message:', error.message);
            // NE PAS marquer audioStarted = true en cas d'erreur
            // pour permettre une nouvelle tentative
            startBtn.textContent = '❌ Erreur - Recliquez ici';
            startBtn.style.background = 'rgba(255, 100, 100, 0.3)';
          });
      }
    }

    // Démarrer le timer de redirection
    function startRedirectTimer() {
      redirectTimeout = setTimeout(() => {
        console.log('⏱️ Temps écoulé, redirection...');
        // Fade out de l'audio
        let volume = 1;
        const fadeOut = setInterval(() => {
          if (volume > 0) {
            volume -= 0.1;
            audio.volume = Math.max(0, volume);
          } else {
            clearInterval(fadeOut);
            audio.pause();
            window.location.href = "accueil.html";
          }
        }, 100);
      }, 10000);
    }

    // SEUL ÉVÉNEMENT : Clic sur le bouton
    startBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      console.log('👆 Clic sur le bouton détecté !');
      startExperience();
    });

    // Touche Enter ou Espace pour démarrer
    document.addEventListener('keydown', function(e) {
      if ((e.key === 'Enter' || e.key === ' ') && !audioStarted) {
        e.preventDefault();
        console.log('⌨️ Touche détectée:', e.key);
        startExperience();
      }
    });

    // Permettre de passer l'intro en cliquant n'importe où (après le démarrage)
    document.addEventListener('click', (e) => {
      if (audioStarted && !e.target.matches('#startBtn')) {
        // Annuler le timeout de redirection automatique
        if (redirectTimeout) {
          clearTimeout(redirectTimeout);
        }

        // Fade out rapide
        let volume = audio.volume;
        const quickFadeOut = setInterval(() => {
          if (volume > 0) {
            volume -= 0.2;
            audio.volume = Math.max(0, volume);
          } else {
            clearInterval(quickFadeOut);
            audio.pause();
            window.location.href = "accueil.html";
          }
        }, 50);
      }
    });

    // Touche Espace ou Entrée pour démarrer ou passer
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        if (!audioStarted) {
          startExperience();
        } else {
          // Annuler le timeout et rediriger immédiatement
          if (redirectTimeout) {
            clearTimeout(redirectTimeout);
          }
          audio.pause();
          window.location.href = "accueil.html";
        }
      }
    });
  </script>
</body>
</html>
