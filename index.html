<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille MAÏ – Redirection...</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta http-equiv="refresh" content="0; url=intro.html">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #004d40 0%, #00695c 50%, #6c8b63 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #f4d03f;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      margin: 0;
      opacity: 0.9;
    }
    p {
      margin: 10px 0 0 0;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h1>Famille MAÏ</h1>
    <p>Redirection en cours...</p>
  </div>
  <script>
    // Redirection JavaScript en cas d'échec de la meta refresh
    setTimeout(() => {
      window.location.href = 'intro.html';
    }, 100);
  </script>
</body>
</html>
